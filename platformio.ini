; Smart Bins - PlatformIO configuration
;
; Pick the environment that matches the flash chip on your board:
;   esp32-4mb, esp32-8mb, esp32-16mb
; The boot log prints the detected flash size and warns on a mismatch.
; Unit tests for hardware-independent code run on the host: pio test -e native

[platformio]
default_envs = esp32-8mb

; Shared settings for all ESP32 builds
[esp32_common]
; pioarduino: community-maintained platform with Arduino-ESP32 core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.filesystem = fatfs
; embed_web: bundles web/ (the UI) into the firmware before every build: src/generated/WebAssets.h
; quiet_libs: silences warnings from the SQLite library's sources (see the script)
extra_scripts =
    pre:tools/embed_web.py
    pre:tools/quiet_libs.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSB_FW_VERSION=\"0.11.2\"
    -Wall
    ; SQLite build settings that override the library's (see the header)
    -Iinclude
    -DSQLITE_CUSTOM_INCLUDE=sb_sqlite_config.h
    ; The SQLite library's file layer gives the rollback journal a write
    ; buffer of this size (8 KB by default). One flash sector is enough and
    ; leaves 4 KB more heap.
    -DSQLITE_ESP32VFS_BUFFERSZ=4096
    ; Messages the web server library queues per WebSocket client (32 by
    ; default). Each one holds its whole text in RAM, and a client that stops
    ; reading (a phone whose screen locked) keeps its queue until the
    ; connection times out. Live updates only need the latest few; a client
    ; whose queue fills up is disconnected (see LiveUpdates.cpp), and its
    ; page reconnects and gets the current state when it wakes up.
    -DWS_MAX_QUEUED_MESSAGES=8
    ; The web server's network task (AsyncTCP) runs on core 0, next to WiFi.
    ; By default it may run on either core, at priority 10, above the LED
    ; tasks (priority 2, core 1). A search keeps it busy for a few hundred ms
    ; without pausing, and on core 1 that stopped the LED effects for that
    ; long; they then jumped ahead to catch up. On core 0 it only competes
    ; with the WiFi tasks (which still come first) and the background photo
    ; jobs, and core 1 stays free for the lights and the main loop. (Its
    ; reads of the database and photos still pause the strips briefly; see
    ; FlashGuard in src/led/RmtStrip.h.)
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; Its stack: 16 KB by default, of which at most about 5.3 KB was ever
    ; used (the "Unused stack" log line, measured through searches, photo
    ; uploads, a backup, a restore and a CSV import). 12 KB keeps more than
    ; twice that and gives 4 KB back to the heap.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
    ; SQLite 3.43 with a file layer for the ESP32's C file API. Pinned to a
    ; commit: the library has no tagged releases.
    https://github.com/siara-cc/esp32_arduino_sqlite3_lib.git#10fb9cfb254cf0261fdb298ee2d7ebc37973f907

[env:esp32-4mb]
extends = esp32_common
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions/4mb.csv
; Size limit for the size check: the 2.25 MB factory slot. PlatformIO finds the
; limit from an ota_0 slot, which this table doesn't have, and would otherwise
; allow the whole 4 MB.
board_upload.maximum_size = 2359296
build_flags = ${esp32_common.build_flags} -DSB_FLASH_MB=4

[env:esp32-8mb]
extends = esp32_common
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions/8mb.csv
build_flags = ${esp32_common.build_flags} -DSB_FLASH_MB=8

[env:esp32-16mb]
extends = esp32_common
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/16mb.csv
build_flags = ${esp32_common.build_flags} -DSB_FLASH_MB=16

; Over-the-air upload to a device already on your network:
;   pio run -e esp32-8mb-ota -t upload
; Set upload_port to the device's IP if smartbins.local doesn't resolve on your computer.
[env:esp32-8mb-ota]
extends = env:esp32-8mb
upload_protocol = espota
upload_port = smartbins.local

[env:esp32-16mb-ota]
extends = env:esp32-16mb
upload_protocol = espota
upload_port = smartbins.local

; Host-side unit tests (no hardware needed)
[env:native]
platform = native
test_framework = unity
; The inventory tests use the system's SQLite (libsqlite3-dev on Debian/Ubuntu)
build_flags = -std=gnu++17 -Wall -lsqlite3
lib_deps =
    bblanchon/ArduinoJson@7.4.3
