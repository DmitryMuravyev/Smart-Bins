; Smart Bins - PlatformIO configuration
;
; Pick the environment that matches the flash chip on your board:
;   esp32-4mb, esp32-8mb, esp32-16mb
; The boot log prints the detected flash size and warns on a mismatch.
; Unit tests for hardware-independent code run on the host: pio test -e native

[platformio]
default_envs = esp32-8mb

; Shared settings for all ESP32 builds
[esp32_common]
; pioarduino: community-maintained platform with Arduino-ESP32 core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSB_FW_VERSION=\"0.1.0\"
    -Wall

[env:esp32-4mb]
extends = esp32_common
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 0x180000
board_build.partitions = partitions/4mb.csv
build_flags = ${esp32_common.build_flags} -DSB_FLASH_MB=4

[env:esp32-8mb]
extends = esp32_common
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 0x1E0000
board_build.partitions = partitions/8mb.csv
build_flags = ${esp32_common.build_flags} -DSB_FLASH_MB=8

[env:esp32-16mb]
extends = esp32_common
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 0x1E0000
board_build.partitions = partitions/16mb.csv
build_flags = ${esp32_common.build_flags} -DSB_FLASH_MB=16

; Host-side unit tests (no hardware needed)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
