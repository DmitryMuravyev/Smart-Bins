name: Build

on:
  push:
    branches: [main]
    # A version tag (v1.0.0) also publishes a draft GitHub release with the
    # binaries (the release job below).
    tags: ["v*"]
  pull_request:
  # A "Run workflow" button on the Actions page, to rebuild main by hand
  # (for example after a run that never started) and refresh the badge.
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native

  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-4mb, esp32-8mb, esp32-16mb, esp32-16mb-psram]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface compiler/linker errors as annotations so they show on the PR
          grep -iE "error|undefined reference|not found|No such" build.log | head -40 | while IFS= read -r line; do
            echo "::error title=Build ${{ matrix.env }}::${line}"
          done
      - name: Release files
        shell: bash
        run: |
          # One image to write at 0x0 over USB, and the firmware alone for
          # updates (see tools/merge_firmware.py).
          pip install esptool==4.8.1
          version=$(grep -oP 'SB_FW_VERSION=\\"\K[^\\]+' platformio.ini)
          python tools/merge_firmware.py ${{ matrix.env }} "$version" release
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: release/*.bin

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check the tag against the firmware version
        shell: bash
        run: |
          version=$(grep -oP 'SB_FW_VERSION=\\"\K[^\\]+' platformio.ini)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the firmware version $version in platformio.ini"
            exit 1
          fi
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft: nothing is public until it is reviewed and published on
          # GitHub. The notes point to the flashing guide. 0.x versions are
          # marked as pre-releases (not every feature is tested on hardware
          # yet); from 1.0 on they are regular releases.
          pre=""
          [[ "${GITHUB_REF_NAME}" == v0.* ]] && pre="--prerelease"
          gh release create "${GITHUB_REF_NAME}" release/*.bin --draft $pre \
            --title "Smart Bins ${GITHUB_REF_NAME}" --notes-file docs/release-notes.md
